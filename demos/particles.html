<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particles Demo</title>
    <style>
      body { margin: 0; background: #020817; color: #e2e8f0; font-family: sans-serif; }
      canvas { display: block; margin: 20px auto; border: 1px solid #334155; }
      .nav { text-align: center; }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <div class="nav"><a href="./index.html">← Back to demos</a></div>
    <canvas id="game" width="920" height="520"></canvas>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const particles = [];

      const emit = (x, y) => {
        for (let i = 0; i < 22; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 45 + Math.random() * 40,
            color: ["#60a5fa", "#34d399", "#fbbf24", "#f472b6"][Math.floor(Math.random() * 4)]
          });
        }
      };

      canvas.addEventListener("click", (event) => {
        const rect = canvas.getBoundingClientRect();
        emit(event.clientX - rect.left, event.clientY - rect.top);
      });

      const tick = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#020817";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 3, 3);
          if (p.life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(tick);
      };

      emit(canvas.width / 2, canvas.height / 2);
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
