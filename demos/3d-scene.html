<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Scene Demo</title>
    <style>
      body { margin: 0; background: #020817; display: grid; place-items: center; min-height: 100vh; color: #e2e8f0; font-family: sans-serif; }
      .panel { text-align: center; }
      canvas { display: block; border: 1px solid #1e293b; background: #020617; }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <div class="panel">
      <canvas id="scene" width="900" height="560"></canvas>
      <p><a href="./index.html">← Back to demos</a></p>
    </div>

    <script src="../game-engine-3d.js"></script>
    <script src="../index.js"></script>
    <script>
      const canvas = document.getElementById("scene");
      const game = new Game3D();
      game.setCanvas(canvas)
        .background("#0f172a");

      const floor = new Sprite3D(12, 0.6, 12, { x: -6, y: -1.2, z: -6, color: "#1f2937" });
      const cubeA = new Sprite3D(2, 2, 2, { x: -2, y: 0, z: 0, color: "#60a5fa" });
      const cubeB = new Sprite3D(1.6, 1.6, 1.6, { x: 2.5, y: 1.2, z: -1.5, color: "#f59e0b" });
      const cubeC = new Sprite3D(1.4, 1.4, 1.4, { x: 0.5, y: 2.5, z: 1.5, color: "#34d399" });

      game.add(floor);
      game.add(cubeA);
      game.add(cubeB);
      game.add(cubeC);

      game.start({
        background: "#0f172a",
        update: (delta) => {
          cubeA.rotationY += delta * 1.5;
          cubeB.rotationX += delta * 2.2;
          cubeC.rotationZ += delta * 1.3;
          game.camera.x = Math.sin(performance.now() * 0.0008) * 10;
          game.camera.z = 12 + Math.cos(performance.now() * 0.0008) * 6;
          game.camera.targetX = 0;
          game.camera.targetY = 1;
          game.camera.targetZ = 0;
        }
      });
    </script>
  </body>
</html>
